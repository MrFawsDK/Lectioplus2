<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fravær - Flexio</title>

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/m3/m3.css">
    <link rel="stylesheet" href="/header/header.css">
    <link rel="stylesheet" href="/fravaer/fravaer.css">
</head>
<body>

<header class="header" id="header"></header>

<main class="fravaer-page">
    <section class="page-head">
        <h1>Fravær</h1>
        <p class="lead">Dit fravær fra Lectio: opgjort, for hele året og pr. hold, med mulighed for at angive årsager.</p>
    </section>

    <div class="empty" id="emptyState">
        <md-icon>event_busy</md-icon>
        <span id="emptyText">Henter fravær …</span>
    </div>

    <div id="content" hidden>
        <!-- Opgjort og hele året -->
        <div class="totals">
            <section class="card total">
                <h2>Opgjort</h2>
                <p class="big" id="periodPct">-</p>
                <p class="sub" id="periodModules"></p>
            </section>
            <section class="card total">
                <h2>For året</h2>
                <p class="big" id="yearPct">-</p>
                <p class="sub" id="yearModules"></p>
            </section>
        </div>

        <md-divider></md-divider>

        <!-- Cirkeldiagram og tabel pr. hold (hele året) -->
        <div class="split">
            <div class="donut-wrap">
                <svg viewBox="0 0 120 120" class="donut" role="img" id="donut" aria-label="Fravær pr. hold, hele året"></svg>
                <div class="donut-center"><strong id="donutTotal">0</strong><span>moduler</span></div>
            </div>

            <div class="table-wrap">
                <table class="absence-table">
                    <thead>
                        <tr><th scope="col">Hold</th><th scope="col">%</th><th scope="col"></th><th scope="col">Moduler</th></tr>
                    </thead>
                    <tbody id="teamBody"></tbody>
                </table>
            </div>
        </div>

        <md-divider></md-divider>

        <!-- Meddelelser og bemærkninger fra Lectio -->
        <details class="module-group" id="warningGroup" open>
            <summary id="warningTitle"></summary>
            <div class="table-wrap">
                <table class="absence-table modules">
                    <thead><tr><th>Dato</th><th>Fra</th><th>Type</th><th>Note</th></tr></thead>
                    <tbody id="warningBody"></tbody>
                </table>
            </div>
        </details>

        <!-- Moduler med fravær -->
        <details class="module-group" id="missingGroup" open>
            <summary id="missingTitle"></summary>
            <div class="table-wrap">
                <table class="absence-table modules">
                    <thead><tr><th>Modul</th><th>Tidspunkt</th><th>Fravær</th><th>Type</th><th>Bemærkning</th><th></th></tr></thead>
                    <tbody id="missingBody"></tbody>
                </table>
            </div>
        </details>

        <details class="module-group" id="registeredGroup">
            <summary id="registeredTitle"></summary>
            <div class="table-wrap">
                <table class="absence-table modules">
                    <thead><tr><th>Modul</th><th>Tidspunkt</th><th>Fravær</th><th>Årsag</th><th>Note</th><th>Bemærkning</th><th></th></tr></thead>
                    <tbody id="registeredBody"></tbody>
                </table>
            </div>
        </details>
    </div>
</main>

<script type="module" src="/m3/material.js"></script>
<script src="/session/session.js"></script>
<script src="/header/header.js"></script>
<script src="/fravaer/fravaer.js"></script>
</body>
</html>
